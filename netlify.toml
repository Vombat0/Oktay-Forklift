# ASN Özel Forklift Servis — Netlify Yayın, Güvenlik ve Önbellek Yapılandırması

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# NOT: CSS/JS dosya adları derleme çıktısında hash içermediği için
# uzun önbellek (immutable) KULLANILMAZ. Aksi halde HTML güncellenip CSS
# güncellenmediğinde tarayıcı eski stilleri kullanır ve sayfa düzeni bozulur.
# HTML'de assets/styles.css?v=... sürüm etiketi ile birlikte kullanılır.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/og-gorsel.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
